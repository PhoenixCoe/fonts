<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Skilful Steering</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 62 58H2Z' fill='%23d4202b'/%3E%3Cpath d='M32 16 52 52H12Z' fill='%23fff'/%3E%3Cpath d='M17 36 22 30H44V36H36V48H29V39Z' fill='%23111'/%3E%3C/svg%3E">
<style>
  :root { --tar:#1c1d20; --tar2:#26282c; --line:#f4f4f2; --dim:#a3a6ab; --red:#d4202b; --ease:cubic-bezier(.16,1,.3,1); }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--tar); color:var(--line); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; }
  ::selection { background:var(--line); color:var(--tar); }
  .road { height:6px; background:repeating-linear-gradient(90deg,var(--line) 0 46px,transparent 46px 82px); opacity:.85; }
  main { flex:1; width:min(1080px,100% - 40px); margin:0 auto; padding:56px 0 64px; }
  .title { display:block; width:min(460px,80%); height:auto; margin:0 auto 28px; }
  .lock { max-width:420px; margin:0 auto; text-align:center; }
  .lock p { color:var(--dim); margin-bottom:20px; }
  form { display:flex; gap:10px; }
  input[type=password], input[type=text] {
    flex:1; min-width:0; background:var(--tar2); color:var(--line); border:2px solid #3a3d42; border-radius:10px;
    padding:13px 15px; font:inherit; outline:none; transition:border-color .2s var(--ease);
  }
  input:focus { border-color:var(--line); }
  button, .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--line); color:var(--tar);
    border:0; border-radius:10px; padding:13px 20px; font:600 1rem system-ui,sans-serif; cursor:pointer; text-decoration:none;
    transition:transform .15s var(--ease), background .2s var(--ease);
  }
  button:hover, .btn:hover { transform:translateY(-2px); }
  button:active, .btn:active { transform:translateY(1px); }
  button:disabled { opacity:.6; cursor:wait; }
  .btn.ghost { background:transparent; color:var(--line); border:2px solid #3a3d42; }
  .btn.ghost:hover { border-color:var(--line); }
  .err { color:#ff7a7f; min-height:1.5em; margin-top:12px; font-size:.95rem; }
  .shake { animation:shake .35s var(--ease); }
  @keyframes shake { 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  #app { display:none; }
  #app.on { display:block; animation:rise .6s var(--ease); }
  @keyframes rise { from{opacity:0;transform:translateY(16px)} }
  .ss { font-family:"Skilful Steering", system-ui; }
  .panel { background:var(--tar2); border-radius:16px; padding:24px; margin-bottom:20px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:18px; }
  .bar label { color:var(--dim); font-size:.9rem; display:flex; align-items:center; gap:10px; }
  input[type=range] { accent-color:var(--line); width:160px; }
  .tester { font-size:96px; line-height:1.1; outline:none; word-break:break-word; min-height:1.2em; }
  .tester:focus { outline:none; }
  h2 { font-size:.8rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:14px; font-weight:600; }
  .downloads { display:flex; flex-wrap:wrap; gap:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px; }
  .grid span { aspect-ratio:1; display:grid; place-items:center; background:var(--tar); border-radius:8px; font-size:34px; }
  .note { color:var(--dim); font-size:.9rem; margin-top:12px; }
  @media (max-width:600px) { .tester { font-size:60px; } main { padding-top:36px; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="road"></div>
<main>
  <img class="title" src="title.png" alt="Skilful Steering" width="881" height="426">

  <section class="lock" id="lock">
    <p>Enter the password to unlock the font.</p>
    <form id="form" autocomplete="off">
      <input type="password" id="pw" placeholder="Password" aria-label="Password" autofocus>
      <button id="go" type="submit">Unlock</button>
    </form>
    <div class="err" id="err"></div>
  </section>

  <section id="app">
    <div class="panel">
      <div class="bar">
        <label>Size <input type="range" id="size" min="24" max="200" value="96"></label>
        <button class="btn ghost" type="button" data-t="SKILFUL STEERING">Title</button>
        <button class="btn ghost" type="button" data-t="Turn left at the T-junction, then keep steering!">Sentence</button>
        <button class="btn ghost" type="button" data-t="ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789">Alphabet</button>
      </div>
      <div class="tester ss" id="tester" contenteditable="true" spellcheck="false">SKILFUL STEERING</div>
    </div>

    <div class="panel">
      <h2>Download</h2>
      <div class="downloads">
        <button type="button" id="dlzip">Download all (.zip)</button>
      </div>
      <p class="note">The zip has TTF and OTF to install, plus WOFF2 and WOFF for websites.</p>
    </div>

    <div class="panel">
      <h2>Every character</h2>
      <div class="grid ss" id="grid"></div>
    </div>
  </section>
</main>
<div class="road"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const form = $('form'), pw = $('pw'), err = $('err'), go = $('go');
  let zipBlob = null;

  async function keyFrom(pass) {
    const lock = await (await fetch('files/lock.json', { cache: 'no-store' })).json();
    const salt = Uint8Array.from(atob(lock.salt), c => c.charCodeAt(0));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: lock.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function open(key, path) {
    const buf = new Uint8Array(await (await fetch(path, { cache: 'no-store' })).arrayBuffer());
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) return;
    err.textContent = ''; go.disabled = true; go.textContent = 'Checking…';
    try {
      const key = await keyFrom(pw.value);
      const font = await open(key, 'files/regular.bin');
      const face = new FontFace('Skilful Steering', font);
      await face.load(); document.fonts.add(face);
      zipBlob = new Blob([await open(key, 'files/pack.bin')], { type: 'application/zip' });
      $('lock').remove();
      $('app').classList.add('on');
      buildGrid();
    } catch (x) {
      err.textContent = 'That password is not right.';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      go.disabled = false; go.textContent = 'Unlock'; pw.select();
    }
  });

  $('dlzip').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob); a.download = 'Skilful Steering.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });

  $('size').addEventListener('input', e => { $('tester').style.fontSize = e.target.value + 'px'; });
  document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => { $('tester').textContent = b.dataset.t; }));

  function buildGrid() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!?.,:;\'"‘’“”-–—_/\\|()[]{}+−=×÷±<>^~*#%@&$£€¢¥©®™°•…«»‹›¡¿§¶←→↑↓ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞßàáâãäåæçèéêëìíîïðñòóôõöøùúûüýþÿŒœŠšŽžŸ';
    const g = $('grid');
    for (const c of chars) { const s = document.createElement('span'); s.textContent = c; g.appendChild(s); }
  }
})();
</script>
</body>
</html>
